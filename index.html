<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookworm 📚</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div><span id="botname">Bookworm 📚</span><small id="tagline">Your friendly book-finding buddy</small></div>
    <div style="display:flex;gap:8px"><button type="button" id="keybtn">🔑 API Key</button><button type="button" id="restart">↻ Restart</button></div>
  </header>
  <div id="keybar" hidden><input id="keyin" type="password" placeholder="Paste your API key here" autocomplete="off"><button type="button" id="keysave">Save</button><button type="button" id="keyclear">Clear</button></div>
  <div id="keynote" hidden></div>
  <div id="kstatus" hidden style="padding:4px 16px;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--brown-d,#4e3119)"></div>
  <div id="chat"></div>
  <div id="chips"></div>
  <form id="f">
    <input id="in" placeholder="Tell me what you like to read…" autocomplete="off">
    <button class="send" id="go" type="submit">Send</button>
  </form>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
