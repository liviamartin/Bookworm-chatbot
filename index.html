<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookworm 📚</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9e6e2;--card:#f7f5f2;--brown:#6b4423;--brown-d:#4e3119;--text:#2b2724;--bot:#dcd8d3;--line:#cfcac4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d1b;--card:#2a2725;--brown:#a8764a;--brown-d:#c08a5c;--text:#ece8e3;--bot:#3a3633;--line:#443f3b}}
:root[data-theme="dark"]{--bg:#1f1d1b;--card:#2a2725;--brown:#a8764a;--brown-d:#c08a5c;--text:#ece8e3;--bot:#3a3633;--line:#443f3b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--card)}
header{background:var(--brown);color:#fff;padding:14px 18px;font-size:1.3rem;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
header small{display:block;font-weight:normal;font-size:.85rem;opacity:.85}
#restart{background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.85rem}
#keybtn{background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.85rem}
#keybar{display:flex;gap:8px;padding:10px 16px;background:var(--bot);border-bottom:1px solid var(--line)}
#keybar[hidden],#keynote[hidden]{display:none}
#keybar input{flex:1;padding:8px 12px;font-size:.9rem}
#keybar button{background:var(--brown);color:#fff;border:0;border-radius:999px;padding:0 14px;cursor:pointer;font-family:system-ui,sans-serif}
#keynote{padding:6px 16px;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--brown-d)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;font-family:system-ui,sans-serif;font-size:.97rem}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--brown);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.chip{border:1px solid var(--brown);background:transparent;color:var(--brown-d);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.88rem}
.chip:hover{background:var(--bot)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:1rem}
button.send{background:var(--brown);color:#fff;border:0;border-radius:999px;padding:0 20px;cursor:pointer;font-family:system-ui,sans-serif;font-size:1rem}
button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header><div>Bookworm 📚<small>Your friendly book-finding buddy</small></div><div style="display:flex;gap:8px"><button type="button" id="keybtn">🔑 API Key</button><button type="button" id="restart">↻ Restart</button></div></header>
  <div id="keybar" hidden><input id="keyin" type="password" placeholder="Paste your API key here" autocomplete="off"><button type="button" id="keysave">Save</button><button type="button" id="keyclear">Clear</button></div>
  <div id="keynote" hidden></div>
  <div id="chat"></div>
  <div id="chips"></div>
  <form id="f">
    <input id="in" placeholder="Tell me what you like to read…" autocomplete="off">
    <button class="send" id="go" type="submit">Send</button>
  </form>
</div>
<script>
const WELCOME = "Hi! I’m Bookworm and I am here to help start your reading experience. What are you looking for?";
const STARTERS = ["What genres are popular right now?","Should I read a series or single book?","What are some up and coming books?"];
const RULES = "You are Bookworm 📚, a friendly, welcoming, and warm chatbot. Your one job is to help people find a book to read based on their interests. Keep replies short (under 120 words), suggest 1-3 real books with a one-line reason each, and ask a gentle follow-up question. Never pitch or recommend a book based on its price. Stay on the topic of finding books. You may not know the very newest releases, so be honest about that and suggest checking a library or bookstore for the latest titles.";

const chat = document.getElementById("chat"), chips = document.getElementById("chips"),
      f = document.getElementById("f"), input = document.getElementById("in"), go = document.getElementById("go");
let history = [], sample = null, busy = false, apiKey = "";
const MODEL = "claude-sonnet-5-5";
(function ensureKeyUI(){
  if(document.getElementById("keybtn")) return;
  const hdr = document.querySelector("header"), rs = document.getElementById("restart");
  const kb = document.createElement("button");
  kb.type = "button"; kb.id = "keybtn"; kb.textContent = "🔑 API Key";
  kb.style.cssText = "background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:6px 12px;cursor:pointer;margin-right:8px;font-size:.85rem";
  if(rs && rs.parentNode) rs.parentNode.insertBefore(kb, rs); else if(hdr) hdr.appendChild(kb);
  const bar = document.createElement("div");
  bar.id = "keybar"; bar.hidden = true; bar.style.cssText = "display:flex;gap:8px;padding:10px 16px;background:#dcd8d3";
  bar.innerHTML = '<input id="keyin" type="password" placeholder="Paste your API key here" autocomplete="off" style="flex:1;padding:8px 12px"><button type="button" id="keysave">Save</button><button type="button" id="keyclear">Clear</button>';
  const note = document.createElement("div"); note.id = "keynote"; note.hidden = true; note.style.cssText = "padding:6px 16px;font-size:.8rem";
  if(hdr){ hdr.after(bar); bar.after(note); }
  const sync = () => { bar.style.display = bar.hidden ? "none" : "flex"; };
  new MutationObserver(sync).observe(bar, {attributes:true, attributeFilter:["hidden"]}); sync();
})();
const keybar = document.getElementById("keybar"), keyin = document.getElementById("keyin"), keynote = document.getElementById("keynote");
const GOOGLE_MODELS = ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-flash-latest"];   // tried in order; edit if Google retires a name
let provider = "anthropic";
try { apiKey = localStorage.getItem("bookworm_key") || ""; provider = localStorage.getItem("bookworm_provider") || "anthropic"; } catch(e) {}
let prov = document.getElementById("provider");
if(!prov){
  prov = document.createElement("select"); prov.id = "provider";
  prov.innerHTML = '<option value="anthropic">Anthropic</option><option value="google">Google</option>';
  prov.style.cssText = "padding:8px;border-radius:999px;border:1px solid #cfcac4;font-size:.9rem";
  keyin.before(prov);
}
prov.value = provider;
function showNote(){ keynote.hidden = !apiKey; keynote.textContent = apiKey ? "🔑 Using your " + (provider === "google" ? "Google" : "Anthropic") + " API key (saved only in this browser)." : ""; }
showNote();
document.getElementById("keybtn").onclick = () => { keybar.hidden = !keybar.hidden; if(!keybar.hidden) keyin.focus(); };
document.getElementById("keysave").onclick = () => {
  apiKey = keyin.value.replace(/["'\s]/g, "");
  if(apiKey.startsWith("sk-ant")) prov.value = "anthropic"; else if(apiKey.startsWith("AIza")) prov.value = "google";
  provider = prov.value; keyin.value = ""; keybar.hidden = true;
  try { localStorage.setItem("bookworm_key", apiKey); localStorage.setItem("bookworm_provider", provider); } catch(e) {}
  showNote();
};
document.getElementById("keyclear").onclick = () => {
  apiKey = ""; keyin.value = ""; keybar.hidden = true;
  try { localStorage.removeItem("bookworm_key"); } catch(e) {}
  showNote();
};
async function viaAnthropic(){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model:MODEL, max_tokens:1000, system:RULES, messages:history})
  });
  const data = await res.json();
  if(!res.ok){ const err = new Error(res.status === 401 ? "Your API key wasn’t accepted. Click 🔑 API Key to update it." : (data.error && data.error.message) || "Request failed."); err.keyError = true; throw err; }
  return data.content.map(c => c.text || "").join("");
}

async function viaGoogle(){
  let lastErr = null;
  for(const model of GOOGLE_MODELS){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);   // give up after 25 seconds
    try{
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
        method:"POST", signal: ctrl.signal,
        headers:{"content-type":"application/json","x-goog-api-key":apiKey},
        body: JSON.stringify({
          systemInstruction:{parts:[{text:RULES}]},
          contents: history.map(m => ({role: m.role === "assistant" ? "model" : "user", parts:[{text:m.content}]})),
          generationConfig:{maxOutputTokens:2000}
        })
      });
      clearTimeout(timer);
      let data = {}; try { data = await res.json(); } catch(e) {}
      const msg = (data.error && data.error.message) || "";
      if(res.status === 401 || res.status === 403 || (res.status === 400 && /API key/i.test(msg))){
        const err = new Error("Your Google API key wasn’t accepted. Click 🔑 API Key to update it."); err.keyError = true; throw err;
      }
      if(res.status === 429){
        const err = new Error("Google says you’ve reached the free limit for now. Wait a minute and try again."); err.keyError = true; throw err;
      }
      if(!res.ok){ lastErr = new Error(msg || "Google returned an error"); continue; }
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const text = parts.map(p => p.text || "").join("");
      if(!text){ lastErr = new Error("Google sent back an empty answer"); continue; }
      return text;
    }catch(e){
      clearTimeout(timer);
      if(e.keyError) throw e;
      lastErr = e.name === "AbortError" ? new Error("Google took too long to answer") : e;
    }
  }
  const err = new Error(((lastErr && lastErr.message) || "Google didn’t answer") + ". Please try again in a moment.");
  err.keyError = true; throw err;
}
function viaKey(){ return provider === "google" ? viaGoogle() : viaAnthropic(); }

function add(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function addCopy(bubble, text){
  const b = document.createElement("button");
  b.type = "button"; b.textContent = "📋 Copy";
  b.style.cssText = "align-self:flex-start;margin-top:-6px;background:transparent;border:1px solid #8a8580;color:inherit;border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;font-family:system-ui,sans-serif";
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch(e) {
      const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch(e2) {} t.remove();
    }
    b.textContent = "✓ Copied"; setTimeout(() => b.textContent = "📋 Copy", 1500);
  };
  bubble.after(b); chat.scrollTop = chat.scrollHeight;
}
function start(){
  history = []; chat.innerHTML = ""; add(WELCOME, "bot"); chips.style.display = "flex";
}
STARTERS.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = q;
  b.onclick = () => send(q); chips.appendChild(b);
});
start();
(async () => { try { sample = await claude.use("sample"); } catch(e) { sample = null; } })();

async function send(text){
  text = text.trim();
  if(!text || busy) return;
  chips.style.display = "none";
  add(text, "me"); input.value = "";
  history.push({role:"user", content:text});
  busy = true; go.disabled = true;
  const bubble = add("Thinking… 📖", "bot");
  try{
    let reply = null, netErr = null;
    if(apiKey){
      try { reply = await viaKey(); bubble.textContent = reply; }
      catch(e){
        if(e.keyError) throw e;
        netErr = new Error("I couldn’t reach " + (provider === "google" ? "Google" : "Anthropic") + " (" + e.message + "). Check your internet connection or ad blocker, then try again.");
        netErr.keyError = true;
      }
    }
    if(reply === null){
      if(!sample){ try { sample = await claude.use("sample"); } catch(e2) { sample = null; } }
      if(!sample) throw (netErr || {code:"unavailable"});
      const turns = history.map((m,i) => i===0 ? {role:m.role, content: RULES + "\n\nUser says: " + m.content} : m);
      const r = await sample(turns, {cache:false, onText:({text}) => { bubble.textContent = text; chat.scrollTop = chat.scrollHeight; }});
      reply = r.text; bubble.textContent = reply;
    }
    addCopy(bubble, reply);
    history.push({role:"assistant", content:reply});
  }catch(e){
    history.pop();
    bubble.textContent = (e && e.keyError) ? e.message : (e && e.code === "not_granted")
      ? "I need your permission to chat. Please allow it and try again! 📚"
      : "Oops, I couldn’t reach my bookshelf. Please try again in a moment.";
  }
  busy = false; go.disabled = false; input.focus();
}
document.getElementById("restart").onclick = () => { busy = false; go.disabled = false; input.value = ""; start(); };
f.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
</script>
</body>
</html>
